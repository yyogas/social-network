name: Repository quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-29
        with:
          persist-credentials: false
      - name: Runtime
        run: python3 --version
      - name: Validate repository
        run: python3 scripts/repository/validate_repository.py
      - name: Test validator behavior
        run: python3 -m unittest discover -s tests/repository -p 'test_*.py' -v
      - name: Verify whitespace
        run: git show --format= --check HEAD
